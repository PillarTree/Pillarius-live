# Pillarius installer preseed (minimal variant)
# Boot the ISO and pick "Install" (or "auto" for a fully automatic install)
# from the boot menu. Installs the Pillarius desktop to disk.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 60
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/get_hostname string pillarius
d-i netcfg/get_domain string local

d-i mirror/country string manual
d-i mirror/http/hostname string ftp.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i apt-setup/security_host string security.debian.org
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true

d-i clock-setup/utc boolean true
d-i time/zone string UTC

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i base-installer/kernel/image string linux-image-amd64

d-i passwd/root-login boolean false
d-i passwd/user-fullname string Pillarius User
d-i passwd/username string user
d-i passwd/user-password password pillarius
d-i passwd/user-password-again password pillarius
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i finish-install/reboot_instead boolean true

# Add the Pillarium apt repository and install the desktop.
d-i preseed/late_command string \
    in-target sh -c 'apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gnupg && curl -fsSL https://spacey32.github.io/pt-apt-repo/install.sh | bash && apt-get install -y --no-install-recommends pillarium spacer-greeter cadet'; \
    in-target sh -c 'systemctl set-default graphical.target; mkdir -p /etc/lightdm/lightdm.conf.d; printf "%s\n" "[Seat:*]" "greeter-session=spacer-greeter" "user-session=pillarium" "autologin-user=user" "autologin-user-timeout=0" > /etc/lightdm/lightdm.conf.d/50-spacer-greeter.conf; mkdir -p /usr/share/xsessions; printf "%s\n" "[Desktop Entry]" "Name=Pillarium" "Comment=Lightweight X11 Window Manager" "Exec=pillarium" "Type=Application" "DesktopNames=Pillarium" > /usr/share/xsessions/pillarium.desktop; mkdir -p /etc/skel/.pillarium /etc/skel/Desktop /etc/skel/Documents /etc/skel/Downloads /etc/skel/Pictures /etc/skel/Videos /etc/skel/Music; printf "%s\n" "{\"wallpaper\": \"/usr/share/backgrounds/pillarius-default.svg\", \"theme\": \"dark\", \"compositor\": \"picom\", \"bar_position\": \"bottom\", \"autostart\": []}" > /etc/skel/.pillarium/config.json'