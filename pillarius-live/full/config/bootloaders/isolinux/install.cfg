label install
	menu label ^Install Pillarius
	kernel /install/vmlinuz
	append vga=normal initrd=/install/initrd.gz -- quiet

label installgui
	menu label ^Install Pillarius (graphical)
	kernel /install/gtk/vmlinuz
	append video=vesa:ywrap,mtrr vga=788 initrd=/install/gtk/initrd.gz -- quiet

label auto
	menu label ^Automatic install
	kernel /install/vmlinuz
	append auto=true priority=critical file=/cdrom/install/preseed.cfg vga=normal initrd=/install/initrd.gz -- quiet

label autogui
	menu label ^Automatic install (graphical)
	kernel /install/gtk/vmlinuz
	append auto=true priority=critical file=/cdrom/install/preseed.cfg video=vesa:ywrap,mtrr vga=788 initrd=/install/gtk/initrd.gz -- quiet

label expert
	menu label ^Expert install
	kernel /install/vmlinuz
	append priority=low vga=normal initrd=/install/initrd.gz -- quiet

label expertgui
	menu label ^Expert install (graphical)
	kernel /install/gtk/vmlinuz
	append priority=low video=vesa:ywrap,mtrr vga=788 initrd=/install/gtk/initrd.gz -- quiet

label rescue
	menu label ^Rescue mode
	kernel /install/vmlinuz
	append rescue/enable=true vga=normal initrd=/install/initrd.gz -- quiet
